<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyeux anniversaire MITOS 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bleu:#2b3bff;--rose:#ff3d9a;--lime:#d7ff3f;--jaune:#ffd23f;--cyan:#00e0ff;--noir:#120a2a;--blanc:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;color:var(--blanc);overflow:hidden;
  background:var(--bleu) radial-gradient(#ffffff2e 2px,transparent 2.5px) 0 0/28px 28px;
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.etoiles{position:fixed;inset:0;z-index:0}
.etoiles i{position:absolute;width:9px;height:9px;background:var(--lime);transform:rotate(45deg);opacity:.7;animation:scint 3s infinite ease-in-out}
@keyframes scint{50%{opacity:.1;transform:rotate(45deg) scale(.3)}}

section{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;overflow-y:auto;gap:1.4rem;padding:1.5rem;text-align:center;
  opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}
section.on{opacity:1;visibility:visible}

h1,.titre{font-family:'Bowlby One','DM Sans',sans-serif;font-weight:400;line-height:1.05}
.intro-t{font-size:clamp(1.7rem,6.5vw,2.8rem);max-width:13ch;text-shadow:4px 4px 0 var(--noir)}
.intro-s{font-weight:800;background:var(--noir);padding:.4rem 1rem;border-radius:999px}

button{
  font:800 1.1rem 'DM Sans',sans-serif;color:var(--noir);background:var(--lime);border:3px solid var(--noir);border-radius:14px;
  padding:.85rem 1.6rem;cursor:pointer;box-shadow:5px 5px 0 var(--noir);transition:opacity .5s,transform .12s,box-shadow .12s;
}
button:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--noir)}
button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--noir)}
button:focus-visible{outline:3px solid var(--blanc);outline-offset:4px}
button.cache{opacity:0;pointer-events:none}

/* Gâteau */
.gateau{position:relative;width:min(88vw,380px);margin-top:3.5rem}
.etage{margin:0 auto;border:3px solid var(--noir);border-radius:14px;position:relative;overflow:hidden;box-shadow:6px 6px 0 var(--noir)}
.haut{width:72%;height:70px;background:var(--rose)}
.bas{width:100%;height:95px;background:var(--jaune);margin-top:-3px}
.etage::after{content:"";position:absolute;left:0;right:0;top:0;height:22px;
  background:radial-gradient(circle at 10px 0,var(--blanc) 10px,transparent 11px) 0 0/20px 22px repeat-x}
.assiette{width:112%;margin:0 -6%;height:16px;border:3px solid var(--noir);border-radius:50%;background:var(--cyan);box-shadow:6px 6px 0 var(--noir)}
.bougies{position:absolute;left:14%;width:72%;top:-34px;height:34px}
.bougie{position:absolute;bottom:0;width:8px;height:26px;border:2px solid var(--noir);border-radius:2px;transform:translateX(-50%)}
.flamme{
  position:absolute;left:50%;bottom:100%;width:14px;height:22px;margin-left:-7px;border:2px solid var(--noir);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;
  background:radial-gradient(circle at 50% 70%,#fff 0 20%,var(--jaune) 50%,#ff7a2e 85%);
  transform:scale(0);transform-origin:50% 100%;transition:transform .3s cubic-bezier(.3,1.8,.5,1)
}
.lit .flamme{transform:scale(1);animation:flam .25s infinite alternate .3s}
@keyframes flam{to{transform:scale(1.1,.92) rotate(4deg)}}
.fume{position:absolute;left:50%;bottom:100%;width:5px;height:5px;background:var(--blanc);opacity:0}
.out .fume{animation:fume 1.2s ease-out}
@keyframes fume{0%{opacity:.9;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translate(8px,-50px) rotate(90deg) scale(4)}}

/* Final */
.petit{font-size:clamp(1.1rem,4vw,1.6rem);color:var(--lime);text-shadow:3px 3px 0 var(--noir)}
.nom{display:flex;gap:.04em;font-size:clamp(3.4rem,18vw,9rem)}
.nom span{display:inline-block;opacity:0;transform:translateY(-120%) rotate(-20deg);color:var(--blanc);
  -webkit-text-stroke:2px var(--noir);paint-order:stroke fill;text-shadow:5px 5px 0 var(--noir)}
.nom span:nth-child(5n+1){--r:-5deg;color:var(--lime)}
.nom span:nth-child(5n+2){--r:3deg}
.nom span:nth-child(5n+3){--r:-3deg;color:var(--rose)}
.nom span:nth-child(5n+4){--r:5deg;color:var(--jaune)}
.nom span:nth-child(5n+5){--r:-2deg;color:var(--cyan)}
.final.on .nom span{animation:tombe .8s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(var(--i)*.12s + .3s)}
@keyframes tombe{to{opacity:1;transform:rotate(var(--r,0deg))}}
.age{display:inline-block;font-family:'Bowlby One',sans-serif;font-size:clamp(1.5rem,6vw,2.3rem);color:var(--blanc);
  background:var(--rose);border:3px solid var(--noir);padding:.15em .8em;border-radius:12px;box-shadow:5px 5px 0 var(--noir);
  text-shadow:2px 2px 0 var(--noir);opacity:0}
.final.on .age{animation:pop .5s 1.5s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-30deg)}to{opacity:1;transform:rotate(-4deg)}}
.msg{display:grid;gap:.6rem;max-width:36ch;font-size:clamp(.95rem,3.4vw,1.15rem);font-weight:600;line-height:1.45;
  background:var(--blanc);color:var(--noir);border:3px solid var(--noir);border-radius:18px;padding:1.1rem 1.2rem;box-shadow:7px 7px 0 var(--noir);opacity:0}
.msg p{opacity:0}
.final.on .msg{animation:fond .5s 2.2s forwards}
.final.on .msg p{animation:fond .8s forwards;animation-delay:calc(var(--k)*.5s + 2.3s)}
.final.on #rejouer{animation:fond 1s 6s forwards;opacity:0}
@keyframes fond{to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .etoiles i,.lit .flamme{animation:none}
  .final.on .nom span,.final.on .age,.final.on .msg,.final.on .msg p,.final.on #rejouer{animation-duration:.01s;animation-delay:0s}
}
</style>
</head>
<body>
<div class="etoiles" id="etoiles" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<section id="intro" class="on">
  <p class="intro-s">Quelqu'un a un message pour toi…</p>
  <h1 class="intro-t">Ce soir, c'est une grande occasion</h1>
  <button id="start">Ouvrir ma surprise</button>
</section>

<section id="scene">
  <p class="titre petit" id="consigne">Allumage des 20 bougies…</p>
  <div class="gateau" aria-hidden="true">
    <div class="bougies" id="bougies"></div>
    <div class="etage haut"></div>
    <div class="etage bas"></div>
    <div class="assiette"></div>
  </div>
  <button id="souffler" class="cache">Souffler les bougies 💨</button>
</section>

<section id="final" class="final">
  <p class="titre petit">Joyeux anniversaire</p>
  <h1 class="nom" id="nom" aria-label="MITOS"></h1>
  <span class="age">20 ans !</span>
  <p class="msg" id="msg"></p>
  <button id="rejouer">Rejouer ✨</button>
</section>

<script>
/* ====== À PERSONNALISER ====== */
const NOM = "MITOS";
const AGE = 20;
// Une ligne = un paragraphe qui apparaît à l'écran
const MESSAGE = `
Arabaina rty nahatratra ny fahanterana ah 🥳🤣
Tsy dia misy ambara bdb ny tenanay f joyeux anniversaire Mitantsoa😙
Je te souhaite tout le bonheur du monde d ho tratra ny 20 ans manaraka ndry🥳♥️✨
On est fière et chanceux d'avoir une pote comme toi ( na d adala aza f iny efa resaka hafa ndray🤣)
Dia ho tonga amin.ny tanjona irina sy ze rehetra kaisaina atao hahahomby avokoa😆✨
De je serai toujours là pour les 20 ans à venir f aza miala lavitra🤣
Aro
`;
/* ============================= */

const $ = s => document.querySelector(s);
const COULEURS = ['#ff3d9a','#d7ff3f','#ffffff','#ffd23f','#00e0ff'];
const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Étoiles de fond
for (let i = 0; i < 50; i++) {
  const e = document.createElement('i');
  e.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;
  $('#etoiles').appendChild(e);
}

// Lettres du nom
$('#nom').innerHTML = [...NOM].map((l,i) => `<span style="--i:${i}">${l}</span>`).join('');
MESSAGE.trim().split('\n').forEach((ligne, k) => {
  const p = document.createElement('p');
  p.textContent = ligne.trim();
  p.style.setProperty('--k', k);
  $('#msg').appendChild(p);
});
$('.age').textContent = AGE + ' ans !';

// Bougies (2 rangées)
const bougies = [];
for (let i = 0; i < AGE; i++) {
  const b = document.createElement('div');
  const rang = i % 2, col = Math.floor(i / 2), n = Math.ceil(AGE / 2);
  b.className = 'bougie';
  b.style.cssText = `left:${(col + .5 + rang*.5) / (n + .5) * 100}%;bottom:${rang ? 8 : 0}px;background:${COULEURS[i % 4]}`;
  b.innerHTML = '<div class="flamme"></div><div class="fume"></div>';
  $('#bougies').appendChild(b);
  bougies.push(b);
}

// Écrans
function montrer(id) {
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === id));
}

// Particules
const cv = $('#fx'), ctx = cv.getContext('2d');
let W, H, parts = [], boucle = false, feux = false;
function taille() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', taille); taille();

function confettis(n = 160) {
  if (reduit) n = 40;
  for (let i = 0; i < n; i++) {
    parts.push({t:'c', x:W/2, y:H*.6, vx:(Math.random()-.5)*16, vy:-Math.random()*16-4,
      r:Math.random()*6+4, a:Math.random()*6, va:(Math.random()-.5)*.4,
      c:COULEURS[i % COULEURS.length], vie:1});
  }
  lancer();
}
function feuArtifice() {
  const x = Math.random()*W*.8 + W*.1, y = Math.random()*H*.4 + H*.1;
  const c = COULEURS[Math.floor(Math.random()*COULEURS.length)];
  for (let i = 0; i < 40; i++) {
    const an = i / 40 * Math.PI * 2, v = Math.random()*4 + 2;
    parts.push({t:'s', x, y, vx:Math.cos(an)*v, vy:Math.sin(an)*v, r:2.5, c, vie:1});
  }
}
function lancer() { if (!boucle) { boucle = true; requestAnimationFrame(frame); } }
let dernier = 0;
function frame(t) {
  ctx.clearRect(0, 0, W, H);
  if (feux && !reduit && t - dernier > 900) { feuArtifice(); dernier = t; }
  parts = parts.filter(p => p.vie > 0 && p.y < H + 30);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy;
    if (p.t === 'c') {
      p.vy += .35; p.vx *= .985; p.a += p.va; p.vie -= .004;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.c; ctx.globalAlpha = Math.min(1, p.vie * 3);
      ctx.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); ctx.restore();
    } else {
      p.vy += .06; p.vx *= .98; p.vie -= .014;
      ctx.beginPath(); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, p.vie);
      ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  if (parts.length || feux) requestAnimationFrame(frame); else boucle = false;
}

// Déroulé
let timer;
function demarrer() {
  feux = false; clearInterval(timer);
  bougies.forEach(b => b.classList.remove('lit', 'out'));
  $('#souffler').classList.add('cache');
  $('#consigne').textContent = `Allumage des ${AGE} bougies…`;
  montrer('scene');
  let i = 0;
  timer = setInterval(() => {
    bougies[i++].classList.add('lit');
    if (i === bougies.length) {
      clearInterval(timer);
      $('#consigne').textContent = 'Fais un vœu, puis souffle !';
      $('#souffler').classList.remove('cache');
    }
  }, 180);
}
function souffler() {
  $('#souffler').classList.add('cache');
  bougies.forEach((b, i) => setTimeout(() => { b.classList.remove('lit'); b.classList.add('out'); }, i * 40));
  setTimeout(() => {
    confettis(220); montrer('final');
    feux = true; lancer();
  }, 1100);
}

$('#start').onclick = demarrer;
$('#souffler').onclick = souffler;
$('#rejouer').onclick = () => { confettis(120); feuArtifice(); };
$('#final').addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') confettis(60); });
</script>
</body>
</html>
