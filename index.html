<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyeux anniversaire MITOS 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:ital,wght@1,700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--texte:#6b3f7e;--rose:#ff8fc0;--rose2:#c2407f;--lilas:#cdb8ff;--ciel:#cfe3ff;--blanc:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Quicksand',system-ui,sans-serif;font-weight:700;color:var(--texte);overflow:hidden;
  background:
    radial-gradient(circle at 12% 18%,#ffc2e0 0,transparent 45%),
    radial-gradient(circle at 88% 28%,#cfe0ff 0,transparent 50%),
    radial-gradient(circle at 50% 95%,#e3d1ff 0,transparent 55%),#fff1f8;
}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.etoiles{position:fixed;inset:0;z-index:0}
.etoiles i{position:absolute;font-style:normal;color:#fff;font-size:14px;text-shadow:0 0 8px #ff8fc0;opacity:.85;animation:scint 3.5s infinite ease-in-out}
.etoiles i::before{content:"✦"}
.etoiles i:nth-child(3n)::before{content:"♡"}
.etoiles i:nth-child(4n){font-size:22px}
.etoiles i:nth-child(5n){font-size:10px}
@keyframes scint{50%{opacity:.15;transform:scale(.5) translateY(-8px)}}

section{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;overflow-y:auto;gap:1.4rem;padding:1.5rem;text-align:center;
  opacity:0;visibility:hidden;transition:opacity .9s,visibility .9s}
section.on{opacity:1;visibility:visible}

h1,.titre{font-weight:400;line-height:1.1}
.intro-t{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:clamp(1.8rem,7vw,3rem);max-width:13ch;color:var(--texte)}
.intro-s{font-family:'Parisienne',cursive;font-size:1.5rem;color:var(--rose2);font-weight:400}

button{
  font:700 1.05rem 'Quicksand',sans-serif;color:var(--texte);cursor:pointer;
  background:#ffffff99;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1.5px solid #fff;border-radius:999px;padding:.85rem 1.8rem;
  box-shadow:0 8px 24px #ff8fc066;transition:opacity .6s,transform .2s,box-shadow .2s;
}
button:hover{transform:translateY(-2px);box-shadow:0 12px 28px #ff8fc08c}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--rose);outline-offset:4px}
button.cache{opacity:0;pointer-events:none}

/* Gâteau */
.gateau{position:relative;width:min(88vw,380px);margin-top:3.5rem}
.etage{margin:0 auto;border:1.5px solid #fff;border-radius:20px 20px 14px 14px;position:relative;overflow:hidden;box-shadow:0 10px 24px #d9a7e673}
.haut{width:64%;height:64px;background:linear-gradient(#ffb8d6,#ff93c3)}
.milieu{width:82%;height:72px;background:linear-gradient(#fffafc,#ffdbea);margin-top:-6px}
.bas{width:100%;height:84px;margin-top:-6px;background:radial-gradient(circle,#fff 3px,transparent 4px) 0 100%/18px 16px repeat-x,linear-gradient(#e6dbff,#c4a9ff)}
.etage::after{content:"";position:absolute;left:0;right:0;top:0;height:26px;
  background:radial-gradient(circle at 10px 0,#fff 10px,transparent 11px) 0 0/20px 24px repeat-x}
.haut::before{content:"";position:absolute;inset:26px 0 0;
  background:radial-gradient(circle,#ff6fae 2px,transparent 2.5px) 6px 8px/22px 18px,radial-gradient(circle,#7fb8ff 2px,transparent 2.5px) 17px 17px/26px 20px,radial-gradient(circle,#ffd36b 2px,transparent 2.5px) 3px 22px/30px 24px}
.milieu::before{content:"";position:absolute;left:0;right:0;top:50%;height:14px;background:linear-gradient(90deg,#ff8fc0,#ffb3d4);box-shadow:inset 0 1px 0 #fff9}
.assiette{width:116%;margin:-2px -8% 0;height:18px;border:1.5px solid #fff;border-radius:50%;background:linear-gradient(#fff,#f1e4ff);box-shadow:0 12px 24px #d9a7e680}
.bougies{position:absolute;left:18%;width:64%;top:-36px;height:36px}
.bougie{position:absolute;bottom:0;width:7px;height:28px;border-radius:3px 3px 1px 1px;transform:translateX(-50%);
  box-shadow:0 0 0 1px #fff,0 2px 4px #b47ad266;background:repeating-linear-gradient(135deg,var(--c) 0 4px,#fff 4px 8px)}
.bougie::before{content:"";position:absolute;left:50%;bottom:100%;width:1.5px;height:5px;margin-left:-.75px;background:#6b4a5a}
.flamme{
  position:absolute;left:50%;bottom:calc(100% + 3px);width:12px;height:22px;margin-left:-6px;
  transform-origin:50% 100%;transform:scale(0);opacity:0;rotate:calc(var(--v,0)*32deg);transition:rotate .08s linear;
  filter:drop-shadow(0 0 5px #ffae3cf2) drop-shadow(0 0 14px #ff8c3c80);pointer-events:none
}
.flamme::before,.flamme::after{content:"";position:absolute;left:0;bottom:0}
.flamme::before{width:12px;height:22px;clip-path:path('M6 0C6.6 6 12 10 12 16A6 6 0 0 1 0 16C0 10 5.4 6 6 0Z');
  background:linear-gradient(to top,#ff6a1f 0,#ffa733 50%,#ffd96b 100%)}
.flamme::after{left:3px;bottom:1px;width:6px;height:13px;clip-path:path('M3 0C3.3 4 6 6 6 9.5A3 3 0 0 1 0 9.5C0 6 2.7 4 3 0Z');
  background:linear-gradient(to top,#5aa9ff 0,#fff3b8 30%,#fff 100%)}
.lit .flamme{animation:allume .8s ease-out both,vacille var(--d,1.1s) ease-in-out .8s infinite}
@keyframes allume{
  0%{transform:scale(.15,.1);opacity:0}
  25%{transform:scale(.55,.4);opacity:.9}
  60%{transform:scale(1.15,1.35);opacity:1}
  100%{transform:scale(1,1);opacity:1}
}
@keyframes vacille{
  0%,100%{transform:scale(1,1) skewX(0);opacity:1}
  20%{transform:scale(.94,1.08) skewX(3deg)}
  45%{transform:scale(1.05,.92) skewX(-2.5deg);opacity:.93}
  70%{transform:scale(.97,1.1) skewX(2deg)}
}
.out .flamme{animation:eteint .3s ease-in forwards}
@keyframes eteint{from{transform:scale(1,1);opacity:1}to{transform:scale(.3,.1) skewX(10deg);opacity:0}}
.fume{position:absolute;left:50%;bottom:calc(100% + 4px);width:5px;height:5px;border-radius:50%;background:#fff;opacity:0}
.out .fume{animation:fume 1.4s ease-out}
@keyframes fume{0%{opacity:.9;transform:translateY(0)}100%{opacity:0;transform:translate(8px,-50px) scale(5)}}
.hint{font-size:.95rem;font-weight:600;opacity:.85}

/* Final */
.petit{font-family:'Parisienne',cursive;font-size:clamp(1.8rem,7vw,2.6rem);color:var(--rose2);text-shadow:0 2px 12px #fff}
.nom{display:flex;gap:.03em;font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:clamp(3.4rem,18vw,9rem)}
.nom span{display:inline-block;opacity:0;transform:translateY(-60%) scale(.8);
  background:linear-gradient(180deg,#ff8fc0,#b58cff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 10px #ffffffcc)}
.final.on .nom span{animation:tombe 1s ease-out forwards;animation-delay:calc(var(--i)*.15s + .3s)}
@keyframes tombe{to{opacity:1;transform:none}}
.age{display:inline-block;font-family:'Parisienne',cursive;font-weight:400;font-size:clamp(1.8rem,7vw,2.6rem);color:var(--rose2);
  background:#ffffffa6;border:1.5px solid #fff;padding:.05em .8em;border-radius:999px;box-shadow:0 8px 24px #ff8fc066;opacity:0}
.final.on .age{animation:pop .8s 1.5s ease-out forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:rotate(-3deg)}}
.msg{display:grid;gap:.6rem;max-width:36ch;font-size:clamp(.95rem,3.4vw,1.1rem);font-weight:600;line-height:1.5;
  background:#ffffff8c;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid #fff;border-radius:28px;
  padding:1.2rem 1.3rem;box-shadow:0 12px 40px #c9a3ff59;opacity:0}
.msg p{opacity:0}
.final.on .msg{animation:fond .8s 2.2s forwards}
.final.on .msg p{animation:fond .8s forwards;animation-delay:calc(var(--k)*.5s + 2.3s)}
.final.on #rejouer{animation:fond 1s 6s forwards;opacity:0}
@keyframes fond{to{opacity:1}}

@media (prefers-reduced-motion:reduce){
  .etoiles i,.lit .flamme{animation:none}
  .final.on .nom span,.final.on .age,.final.on .msg,.final.on .msg p,.final.on #rejouer{animation-duration:.01s;animation-delay:0s}
}
</style>
</head>
<body>
<div class="etoiles" id="etoiles" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<section id="intro" class="on">
  <p class="intro-s">Quelqu'un a un message pour toi…</p>
  <h1 class="intro-t">Ce soir, c'est une grande occasion</h1>
  <button id="start">Ouvrir ma surprise</button>
  <p class="hint">Autorise le micro : tu devras vraiment souffler sur ton téléphone 🎤</p>
</section>

<section id="scene">
  <p class="titre petit" id="consigne">Allumage des 20 bougies…</p>
  <div class="gateau" aria-hidden="true">
    <div class="bougies" id="bougies"></div>
    <div class="etage haut"></div>
    <div class="etage milieu"></div>
    <div class="etage bas"></div>
    <div class="assiette"></div>
  </div>
</section>

<section id="final" class="final">
  <p class="titre petit">Joyeux anniversaire</p>
  <h1 class="nom" id="nom" aria-label="MITOS"></h1>
  <span class="age">20 ans !</span>
  <p class="msg" id="msg"></p>
  <button id="rejouer">Rejouer ✨</button>
</section>

<script>
/* ====== À PERSONNALISER ====== */
const NOM = "MITOS";
const AGE = 20;
// Une ligne = un paragraphe qui apparaît à l'écran
const MESSAGE = `
Arabaina rty nahatratra ny fahanterana ah 🥳🤣
Tsy dia misy ambara bdb ny tenanay f joyeux anniversaire Mitantsoa😙
Je te souhaite tout le bonheur du monde d ho tratra ny 20 ans manaraka ndry🥳♥️✨
On est fière et chanceux d'avoir une pote comme toi ( na d adala aza f iny efa resaka hafa ndray🤣)
Dia ho tonga amin.ny tanjona irina sy ze rehetra kaisaina atao hahahomby avokoa😆✨
De je serai toujours là pour les 20 ans à venir f aza miala lavitra🤣
Aro
`;
/* ============================= */

const $ = s => document.querySelector(s);
const COULEURS = ['#ff8fc0','#ffd0a8','#cfe3ff','#cdb8ff','#ffffff'];
const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Étoiles de fond
for (let i = 0; i < 50; i++) {
  const e = document.createElement('i');
  e.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s`;
  $('#etoiles').appendChild(e);
}

// Lettres du nom
$('#nom').innerHTML = [...NOM].map((l,i) => `<span style="--i:${i}">${l}</span>`).join('');
MESSAGE.trim().split('\n').forEach((ligne, k) => {
  const p = document.createElement('p');
  p.textContent = ligne.trim();
  p.style.setProperty('--k', k);
  $('#msg').appendChild(p);
});
$('.age').textContent = AGE + ' ans !';

// Bougies (2 rangées)
const bougies = [];
for (let i = 0; i < AGE; i++) {
  const b = document.createElement('div');
  const rang = i % 2, col = Math.floor(i / 2), n = Math.ceil(AGE / 2);
  b.className = 'bougie';
  b.style.cssText = `left:${(col + .5 + rang*.5) / (n + .5) * 100}%;bottom:${rang ? 8 : 0}px;--c:${COULEURS[i % 4]};--d:${(.8 + Math.random() * .8).toFixed(2)}s`;
  b.innerHTML = '<div class="flamme"></div><div class="fume"></div>';
  $('#bougies').appendChild(b);
  bougies.push(b);
}

// Écrans
function montrer(id) {
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === id));
}

// Particules
const cv = $('#fx'), ctx = cv.getContext('2d');
let W, H, parts = [], boucle = false, feux = false;
function taille() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', taille); taille();

function confettis(n = 160) {
  if (reduit) n = 40;
  for (let i = 0; i < n; i++) {
    parts.push({t:'c', x:W/2, y:H*.6, vx:(Math.random()-.5)*16, vy:-Math.random()*16-4,
      r:Math.random()*6+4, a:Math.random()*6, va:(Math.random()-.5)*.4,
      c:COULEURS[i % COULEURS.length], vie:1});
  }
  lancer();
}
function feuArtifice() {
  const x = Math.random()*W*.8 + W*.1, y = Math.random()*H*.4 + H*.1;
  const c = COULEURS[Math.floor(Math.random()*COULEURS.length)];
  for (let i = 0; i < 40; i++) {
    const an = i / 40 * Math.PI * 2, v = Math.random()*4 + 2;
    parts.push({t:'s', x, y, vx:Math.cos(an)*v, vy:Math.sin(an)*v, r:2.5, c, vie:1});
  }
}
function lancer() { if (!boucle) { boucle = true; requestAnimationFrame(frame); } }
let dernier = 0;
function frame(t) {
  ctx.clearRect(0, 0, W, H);
  if (feux && !reduit && t - dernier > 900) { feuArtifice(); dernier = t; }
  parts = parts.filter(p => p.vie > 0 && p.y < H + 30);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy;
    if (p.t === 'c') {
      p.vy += .35; p.vx *= .985; p.a += p.va; p.vie -= .004;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.c; ctx.globalAlpha = Math.min(1, p.vie * 3);
      ctx.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); ctx.restore();
    } else {
      p.vy += .06; p.vx *= .98; p.vie -= .014;
      ctx.beginPath(); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, p.vie);
      ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  if (parts.length || feux) requestAnimationFrame(frame); else boucle = false;
}

// Micro : souffler sur le téléphone
let ac, analyseur, flux, micOK = false, micRefuse = false, pret = false, ecoute = false, fini = false;
function initMicro() {
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    ac.resume();
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}})
      .then(f => {
        flux = f; analyseur = ac.createAnalyser(); analyseur.fftSize = 512;
        ac.createMediaStreamSource(f).connect(analyseur);
        micOK = true;
        if (pret) { annoncer(); ecouter(); }
      }).catch(() => { micRefuse = true; if (pret) annoncer(); });
  } catch (e) { micRefuse = true; }
}
function annoncer() {
  if (micOK) { $('#consigne').textContent = 'Fais un vœu, puis souffle sur ton téléphone 🌬️'; return; }
  if (micRefuse) {
    $('#consigne').textContent = 'Micro indisponible : touche le gâteau pour souffler 🌬️';
    $('.gateau').style.cursor = 'pointer';
    $('.gateau').onclick = souffler;
  } else {
    $('#consigne').textContent = 'Autorise le micro, puis souffle sur ton téléphone 🌬️';
  }
}
function ecouter() {
  if (ecoute || fini) return;
  ecoute = true;
  const d = new Uint8Array(analyseur.fftSize);
  let fort = 0;
  (function tick() {
    if (!ecoute) return;
    analyseur.getByteTimeDomainData(d);
    let s = 0;
    for (const v of d) { const x = (v - 128) / 128; s += x * x; }
    const niv = Math.sqrt(s / d.length);
    $('#bougies').style.setProperty('--v', Math.min(1, niv * 5).toFixed(2));
    fort = niv > .15 ? fort + 1 : Math.max(0, fort - 2);
    if (fort > 15) { souffler(); return; }
    requestAnimationFrame(tick);
  })();
}

// Déroulé
let timer;
function demarrer() {
  feux = false; clearInterval(timer);
  bougies.forEach(b => b.classList.remove('lit', 'out'));
  $('#consigne').textContent = `Allumage des ${AGE} bougies…`;
  montrer('scene');
  let i = 0;
  timer = setInterval(() => {
    bougies[i++].classList.add('lit');
    if (i === bougies.length) {
      clearInterval(timer);
      pret = true; annoncer();
      if (micOK) ecouter();
    }
  }, 180);
}
function souffler() {
  if (fini) return;
  fini = true; ecoute = false;
  if (flux) flux.getTracks().forEach(t => t.stop());
  if (ac && ac.close) ac.close();
  bougies.forEach((b, i) => setTimeout(() => { b.classList.remove('lit'); b.classList.add('out'); }, i * 40));
  setTimeout(() => {
    confettis(220); montrer('final');
    feux = true; lancer();
  }, 1100);
}

$('#start').onclick = () => { initMicro(); demarrer(); };
$('#rejouer').onclick = () => { confettis(120); feuArtifice(); };
$('#final').addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') confettis(60); });
</script>
</body>
</html>
